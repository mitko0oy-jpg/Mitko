<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поръчки</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/theme.js"></script>
</head>
<body class="wide">
  <main class="stack" id="app">
    <div class="row spread">
      <div class="row"><h1>Поръчки</h1><span class="muted small" id="count"></span></div>
      <div class="head-tools">
        <button class="btn filters-toggle" id="filtersBtn">Филтри</button>
        <input type="search" id="q" placeholder="Име, телефон, № или товарителница" aria-label="Търсене">
        <button class="btn" id="refresh">Обнови</button>
        <button class="btn primary" id="newOrder">+ Нова поръчка</button>
      </div>
    </div>

    <div class="work">
      <aside class="side" id="side" aria-label="Филтри">
        <div>
          <h3>Статус</h3>
          <div class="stlist" id="stages"></div>
        </div>
        <label class="chk"><input type="checkbox" id="nowaybill"> Само без товарителница</label>
        <div>
          <h3>Потвърждение</h3>
          <select id="confirmed" aria-label="Потвърждение"><option value="">Всички</option><option value="no">Непотвърдени</option><option value="ai">🤖 Потвърдени от AI</option><option value="us">✓ Потвърдени от нас</option></select>
        </div>
        <div>
          <h3>Магазин</h3>
          <select id="shop" aria-label="Магазин"><option value="">Всички магазини</option></select>
        </div>
        <div>
          <h3>Пазар</h3>
          <select id="region" aria-label="Пазар"><option value="">България и чужбина</option><option value="bg">България</option><option value="abroad">Чужбина</option></select>
        </div>
        <div>
          <h3>Куриер</h3>
          <select id="courier" aria-label="Куриер"><option value="">Всички</option><option value="speedy">Спиди</option><option value="econt">Еконт</option><option value="other">Други</option></select>
        </div>
        <div>
          <h3>Поръчани</h3>
          <div class="dates"><input type="date" id="from" aria-label="От"><input type="date" id="to" aria-label="До"></div>
        </div>
        <button class="btn" id="clear">Изчисти филтрите</button>
      </aside>

      <section class="card" style="padding:8px 12px 12px">
        <div class="tabs" id="tabs" role="tablist">
          <button data-tab="active">Активни<span class="n" id="nActive"></span></button>
          <button data-tab="done">Приключени<span class="n" id="nDone"></span></button>
          <button data-tab="">Всички<span class="n" id="nAll"></span></button>
          <button data-tab="archived">Архивирани</button>
        </div>
        <div class="scroll"><table class="otbl" id="table"></table></div>
        <div class="pager" id="pager"></div>
        <div class="bulk" id="bulk" hidden></div>
      </section>
    </div>
  </main>
  <script type="module" src="/assets/poruchki.js"></script>
</body>
</html>
