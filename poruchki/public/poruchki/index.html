<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поръчки</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/theme.js"></script>
</head>
<body class="wide">
  <main class="stack" id="app">
    <div class="pagehead">
      <div class="row">
        <h1>Поръчки</h1>
        <button class="roundbtn" id="newOrder" title="Нова поръчка" aria-label="Нова поръчка">+</button>
        <span class="muted small" id="count"></span>
      </div>
      <div class="head-tools">
        <button class="btn filters-toggle" id="filtersBtn">Филтри</button>
        <label class="searchbox"><input type="search" id="q" placeholder="Име, телефон, № или товарителница" aria-label="Търсене"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></label>
        <button class="btn" id="refresh" title="Изтегли новите поръчки от магазините">Обнови</button>
      </div>
    </div>

    <div class="work" id="work">
      <button class="vtab" id="vtab" type="button" aria-controls="side" aria-expanded="true">Филтри</button>
      <aside class="side" id="side" aria-label="Филтри">
        <div class="side-head"><h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 4h18l-7 9v6l-4 2v-8z"/></svg> Филтри</h2><button class="iconbtn" id="closeSide" aria-label="Скрий филтрите">✕</button></div>
        <div class="side-top">
          <button class="btn primary" id="clear">Изчисти филтрите</button>
          <button class="btn" id="starBtn" title="Запазени филтри" aria-label="Запазени филтри" aria-expanded="false">☆</button>
        </div>
        <div class="starmenu" id="starMenu" hidden></div>
        <label class="fld">Сортиране
          <select id="sort">
            <option value="">По подразбиране (най-новите)</option>
            <option value="old">Най-старите първо</option>
            <option value="sum_desc">Най-голяма сума</option>
            <option value="sum_asc">Най-малка сума</option>
            <option value="sent">Последно изпратени</option>
            <option value="courier">Последна промяна при куриера</option>
            <option value="parcel_asc">Най-стара промяна при куриера</option>
            <option value="stage_asc">Статус (нови първо)</option>
            <option value="stage_desc">Статус (приключени първо)</option>
            <option value="shop_asc">Магазин (А → Я)</option>
            <option value="shop_desc">Магазин (Я → А)</option>
            <option value="cour_asc">Куриер (А → Я)</option>
            <option value="cour_desc">Куриер (Я → А)</option>
            <option value="note_desc">С бележка първо</option>
            <option value="note_asc">Без бележка първо</option>
          </select>
        </label>
        <label class="fld">Магазин<select id="shop"><option value="">Всички магазини</option></select></label>
        <label class="fld">Продукти<select id="product"><option value="">Всички продукти</option></select></label>
        <label class="fld">Куриер<select id="courier"><option value="">Всички</option><option value="speedy">Спиди</option><option value="econt">Еконт</option><option value="other">Други</option></select></label>
        <label class="tgl"><input type="checkbox" id="sentToday"><span class="sw" aria-hidden="true"></span><span class="t">Изпратени днес</span><span class="n" id="nSent"></span></label>
        <div>
          <h3>Статус</h3>
          <div class="tgllist" id="stages"></div>
        </div>
        <label class="tgl"><input type="checkbox" id="nowaybill"><span class="sw" aria-hidden="true"></span><span class="t">Само без товарителница</span></label>
        <label class="tgl" title="Клиенти със сигнали в nekorekten.com"><input type="checkbox" id="nek"><span class="sw" aria-hidden="true"></span><span class="t">Със сигнали (nekorekten)</span></label>
        <label class="fld">Потвърждение<select id="confirmed"><option value="">Всички</option><option value="no">Непотвърдени</option><option value="ai">🤖 Потвърдени от AI</option><option value="us">✓ Потвърдени от нас</option></select></label>
        <label class="fld">Пазар<select id="region"><option value="">България и чужбина</option><option value="bg">България</option><option value="abroad">Чужбина</option></select></label>
        <div>
          <h3>Поръчани</h3>
          <div class="dates"><input type="date" id="from" aria-label="От"><input type="date" id="to" aria-label="До"></div>
        </div>
      </aside>

      <section class="card" style="padding:8px 12px 12px">
        <div class="tabsbar">
          <div class="tabs" id="tabs" role="tablist">
            <button data-tab="active">Активни поръчки<span class="n" id="nActive"></span></button>
            <button data-tab="done">Приключени<span class="n" id="nDone"></span></button>
            <button data-tab="">Всички<span class="n" id="nAll"></span></button>
            <button data-tab="archived">Архивирани поръчки</button>
          </div>
          <div class="tabletools">
            <button class="toolbtn blue" id="exportBtn" title="Свали поръчките по тези филтри (Excel)" aria-label="Свали в Excel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M12 11v6M9 14l3 3 3-3"/></svg></button>
            <div class="popwrap"><button class="toolbtn yellow" id="colsBtn" title="Колони" aria-label="Кои колони да се виждат" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
              <div class="pop" id="colsMenu" hidden></div></div>
            <button class="toolbtn" id="fullBtn" title="На цял екран" aria-label="На цял екран"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
          </div>
        </div>
        <div class="scroll"><table class="otbl" id="table"></table></div>
        <div class="pager" id="pager"></div>
        <div class="bulk" id="bulk" hidden></div>
      </section>
    </div>
  </main>
  <script type="module" src="/assets/poruchki.js"></script>
</body>
</html>
