<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поръчки</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <main class="stack" id="app">
    <div class="row spread"><h1>Поръчки</h1><span class="muted small" id="count"></span></div>
    <section class="card stack">
      <div class="filters">
        <input type="search" id="q" placeholder="Име, телефон, № поръчка или товарителница" aria-label="Търсене" style="flex:1;min-width:220px">
      </div>
      <div class="filters">
        <select id="stage" aria-label="Етап">
          <option value="">Всички етапи</option>
          <option value="open">Още не са приключили</option>
          <option value="new">Нови</option>
          <option value="shipped">На път</option>
          <option value="at_office">Чакат в офис</option>
          <option value="delivered">Взети</option>
          <option value="returned">Върнати</option>
          <option value="refused">Отказани на място</option>
          <option value="canceled">Отказани</option>
          <option value="archived">Архивирани</option>
        </select>
        <select id="region" aria-label="Пазар"><option value="">България и чужбина</option><option value="bg">България</option><option value="abroad">Чужбина</option></select>
        <select id="shop" aria-label="Магазин"><option value="">Всички магазини</option></select>
        <span class="row small"><input type="date" id="from" aria-label="От"> – <input type="date" id="to" aria-label="До"></span>
        <button class="btn link small" id="clear">Изчисти</button>
      </div>
    </section>
    <section class="card">
      <div class="scroll" id="list"></div>
      <div class="pager" id="pager"></div>
    </section>
  </main>
  <script type="module" src="/assets/poruchki.js"></script>
</body>
</html>
