<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Счетоводство – OrderDesk</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151a20" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OrderDesk">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Поръчките от всички магазини, товарителници, склад и незавършени колички на едно място.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="OrderDesk">
  <meta property="og:title" content="Счетоводство – OrderDesk">
  <meta property="og:description" content="Поръчките от всички магазини, товарителници, склад и незавършени колички на едно място.">
  <meta property="og:image" content="https://mitko-poruchki.netlify.app/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="OrderDesk – поръчки, товарителници и склад">
  <meta property="og:locale" content="bg_BG">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/theme.js"></script>
</head>
<body>
  <main class="stack" id="app">
    <div class="pagehead">
      <div class="row"><h1>Счетоводство</h1></div>
      <div class="head-tools">
        <label class="small muted" for="month">Месец</label>
        <input type="month" id="month" min="2024-01">
        <button class="btn" id="reload">Обнови</button>
      </div>
    </div>
    <div class="seg" id="tabs" role="tablist">
      <button type="button" data-t="otchet">Печалба</button>
      <button type="button" data-t="prodazhbi">Продажби</button>
      <button type="button" data-t="razhodi">Разходи</button>
      <button type="button" data-t="banka">Банка</button>
      <button type="button" data-t="nap">НАП и счетоводител</button>
      <button type="button" data-t="nastroiki">Настройки</button>
    </div>
    <div id="view" class="stack"></div>
  </main>
  <dialog class="modal" id="dlg"></dialog>
  <script type="module" src="/assets/schetovodstvo.js"></script>
</body>
</html>
