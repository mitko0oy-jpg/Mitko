<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Магазини – OrderDesk</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151a20" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OrderDesk">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Поръчките от всички магазини, товарителници, склад и незавършени колички на едно място.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="OrderDesk">
  <meta property="og:title" content="Магазини – OrderDesk">
  <meta property="og:description" content="Поръчките от всички магазини, товарителници, склад и незавършени колички на едно място.">
  <meta property="og:image" content="https://mitko-poruchki.netlify.app/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="OrderDesk – поръчки, товарителници и склад">
  <meta property="og:locale" content="bg_BG">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/theme.js"></script>
</head>
<body class="wide">
  <main class="stack" id="app">
    <div class="pagehead">
      <div class="row">
        <h1>Магазини</h1>
        <button class="roundbtn" id="addShop" title="Добави магазин" aria-label="Добави магазин">+</button>
        <span class="muted small" id="count"></span>
      </div>
      <div class="head-tools">
        <label class="searchbox"><input type="search" id="q" placeholder="Търсене по име или сайт" aria-label="Търсене"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></label>
      </div>
    </div>
    <section class="card" style="padding:8px 12px 12px">
      <div class="tabs" id="tabs" role="tablist">
        <button data-tab="on" class="on">Инсталирани магазини<span class="n" id="nOn"></span></button>
        <button data-tab="off">Спрени магазини<span class="n" id="nOff"></span></button>
      </div>
      <div class="scroll"><table class="otbl shopsTbl" id="table"></table></div>
    </section>
  </main>
  <dialog class="modal" id="dlg"></dialog>
  <script type="module" src="/assets/magazini.js"></script>
</body>
</html>
