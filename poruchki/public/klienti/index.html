<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Клиенти – OrderDesk</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151a20" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OrderDesk">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Поръчките от всички магазини, товарителници, склад и незавършени колички на едно място.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="OrderDesk">
  <meta property="og:title" content="Клиенти – OrderDesk">
  <meta property="og:description" content="Поръчките от всички магазини, товарителници, склад и незавършени колички на едно място.">
  <meta property="og:image" content="https://mitko-poruchki.netlify.app/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="OrderDesk – поръчки, товарителници и склад">
  <meta property="og:locale" content="bg_BG">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/theme.js"></script>
</head>
<body>
  <main class="stack" id="app">
    <div class="pagehead">
      <div class="row"><h1>Клиенти</h1></div>
      <div class="head-tools">
        <button class="btn" id="reload">Обнови</button>
      </div>
    </div>

    <section class="tiles" id="tiles" aria-label="Накратко" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"></section>

    <section class="card stack">
      <div class="row" style="flex-wrap:wrap;gap:8px">
        <input type="search" id="q" placeholder="Име, телефон, имейл или град" style="flex:1;min-width:200px">
        <div class="seg" id="seg">
          <button type="button" data-v="" class="on">Всички</button>
          <button type="button" data-v="repeat">Повторни</button>
          <button type="button" data-v="vip">VIP</button>
          <button type="button" data-v="new">С една поръчка</button>
          <button type="button" data-v="open">С поръчка в момента</button>
        </div>
        <select id="risk" aria-label="Риск">
          <option value="">Всеки риск</option>
          <option value="high">Висок риск</option>
          <option value="medium">Среден риск</option>
          <option value="low">Нисък риск</option>
        </select>
        <select id="sort" aria-label="Подреди по">
          <option value="last">Последна поръчка</option>
          <option value="spent">Похарчено</option>
          <option value="orders">Брой поръчки</option>
          <option value="returned">Върнати пратки</option>
          <option value="first">Нови клиенти</option>
        </select>
      </div>
      <p class="muted small" style="margin:0" id="how"></p>
      <div class="scroll"><table class="tbl" id="tbl">
        <thead><tr><th>Клиент</th><th>Телефон</th><th class="r">Поръчки</th><th class="r">Взети / върнати</th><th class="r">Похарчено</th><th>Последна поръчка</th><th>Магазини</th><th>Риск</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
      <div class="row spread small"><span class="muted" id="count"></span><span class="row" style="gap:6px"><button class="btn sm" id="prev">‹ Назад</button><button class="btn sm" id="next">Напред ›</button></span></div>
    </section>
  </main>
  <script type="module" src="/assets/klienti.js"></script>
</body>
</html>
