<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Вход – OrderDesk</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151a20" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OrderDesk">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Поръчките от всички магазини, товарителници, склад и незавършени колички на едно място.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="OrderDesk">
  <meta property="og:title" content="OrderDesk">
  <meta property="og:description" content="Поръчките от всички магазини, товарителници, склад и незавършени колички на едно място.">
  <meta property="og:image" content="https://mitko-poruchki.netlify.app/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="OrderDesk – поръчки, товарителници и склад">
  <meta property="og:locale" content="bg_BG">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/theme.js"></script>
</head>
<body>
  <main class="center login">
    <section class="card logincard">
      <div class="loginbrand">
        <img src="/assets/icon.svg" alt="" width="56" height="56">
        <div><h1>Order<span class="b2">Desk</span></h1><p class="muted small">Поръчки, товарителници и обаждания на едно място</p></div>
      </div>
      <p class="muted small" id="lead">Влез с имейла и паролата си.</p>
      <form class="form" id="login">
        <label>Имейл<input type="email" name="email" autocomplete="username" required></label>
        <label>Парола<input type="password" name="password" autocomplete="current-password" required></label>
        <button class="btn primary">Влез</button>
      </form>
      <form class="form" id="setup" hidden>
        <label>Твоето име<input type="text" name="name" autocomplete="name" required></label>
        <label>Имейл<input type="email" name="email" autocomplete="username" required></label>
        <label>Парола (поне 10 знака)<input type="password" name="password" minlength="10" autocomplete="new-password" required></label>
        <label>Код за първи вход<input type="text" name="code" autocomplete="off" required></label>
        <button class="btn primary">Създай профила</button>
      </form>
      <p class="err small" id="err"></p>
    </section>
  </main>
  <script type="module" src="/assets/vhod.js"></script>
</body>
</html>
