  beeherb:  { a: '#86A72E', d: '#617D17', n: '#1B220C', shape: 'leaf' },     // билки
  bvpatch:  { a: '#E9B23A', d: '#B8860B', n: '#17183A', shape: 'sparkle', dark: true }, // злато в нощта
  tibet:    { a: '#DC4F25', d: '#B23912', n: '#33100A', shape: 'flame', dark: true },    // шафран и топлина
  vein:     { a: '#1E9E6A', d: '#15794F', n: '#0C2419', shape: 'leaf' },     // конски кестен, свежи крака
  nail:     { a: '#B45CC8', d: '#8E3BA3', n: '#26112D', shape: 'sparkle' },  // чист и подреден вид

  ghk:      { a: '#B8692F', d: '#8F4C1C', n: '#24140B', shape: 'sparkle', dark: true },  // мед, лой и мед(ен пептид)
  apetit:   { a: '#4FAE2E', d: '#37871B', n: '#10220A', shape: 'leaf' },
  berberin: { a: '#C99A0E', d: '#9C7606', n: '#1E220E', shape: 'leaf' },
  energy:   { a: '#FF6A13', d: '#D44F00', n: '#2A1206', shape: 'bolt' },
  stress:   { a: '#8C7BDB', d: '#6553C0', n: '#1C1838', shape: 'bubble' },
  nad:      { a: '#7C3AED', d: '#5B21B6', n: '#1A0F33', shape: 'sparkle', dark: true },
  focus:    { a: '#0891B2', d: '#066E88', n: '#071F27', shape: 'dot' },
  mood:     { a: '#F2678E', d: '#D0446D', n: '#2D0F1A', shape: 'sun' },
  love:     { a: '#D41F4E', d: '#A8143A', n: '#2B0A14', shape: 'heart' }

/* ---------- 3D сцени и раздвижените им версии (Higgsfield), в landing/zdravets/media/ ----------
   ZN_MEDIA е commit-ът с файловете (jsDelivr го пази завинаги). */
const ZN_MEDIA = '9b01f1df86aa5fb0fd322240f5499b5365c05044';
const znM = f => `https://cdn.jsdelivr.net/gh/mitko0oy-jpg/Mitko@${ZN_MEDIA}/landing/zdravets/media/${f}`;
const SCENES = ['spray', 'hyal', 'beeherb', 'bvpatch', 'tibet', 'vein', 'nail', 'skin', 'ghk',
  'apetit', 'berberin', 'energy', 'stress', 'nad', 'focus', 'mood', 'love'];
const SCENE_VIDEOS = SCENES; // всички имат и раздвижена версия
const sceneOf = id => SCENES.includes(id)
  ? { img: znM(`scene-${id}.webp`), small: znM(`scene-${id}-600.webp`), video: SCENE_VIDEOS.includes(id) ? znM(`scene-${id}.mp4`) : null }
  : null;

   Тук има само функции – извикват се от app.js и landing.js.

/* ---------- как изглежда продуктът: 3D сцената и цветът му (landing-data.js) ---------- */
function productLook(p) {
  const sc = sceneOf(p.id), th = THEMES[p.id];
  const gel = p.id === 'gel';
  return {
    img: gel ? BVM(BV.hero, 'hero-scene-700.webp') : sc ? sc.small : p.img,
    big: gel ? BVM(BV.hero, 'hero-scene-1200.webp') : sc ? sc.img : p.img,
    video: sc ? sc.video : null,
    scene: gel || !!sc, gel,
    a: th ? th.a : '#F5A623', d: th ? th.d : '#E08A00'
  };
}
const catOf = p => CATEGORIES.find(c => c.id === p.cat) || { name: '', short: '' };
const fromPrice = p => (p.packs ? Math.min(...PACKS[p.packs].map(k => k.price)) : p.price);

/* ---------- комплектите от пластири по избор ----------
   В ConvertBuilder: продуктът „Комплект N вида пластири“ носи цената, а всеки избран вид е ред за 0 €
   („… (в комплект)“) – така поръчката в OrderDesk казва точно какво да се изпрати. */
const comboReady = () => PATCH_COMBOS.some(c => c.store) && PRODUCTS.filter(p => p.wellness).every(p => PATCH_IN_COMBO[p.id]);
const comboOf = store => PATCH_COMBOS.find(c => c.store && c.store === store);
const inComboOf = store => Object.keys(PATCH_IN_COMBO).find(id => PATCH_IN_COMBO[id] && PATCH_IN_COMBO[id] === store);
async function addCombo(n, ids, { go = false, btn = null } = {}) {
  const c = PATCH_COMBOS.find(x => x.n === n);
  if (!c || !c.store || ids.length !== n) return;
  await addFlow({ store: c.store, qty: 1, btn, value: c.price, contentId: `combo${n}:${ids.join('+')}`, extra: ids.map(id => PATCH_IN_COMBO[id]), go });
}
// всеки вид в комплект трябва да има свой комплект: без комплекта редовете за 0 € се махат
async function syncCombos() {
  if (!cbReady() || !PATCH_COMBOS.some(c => c.store)) return;
  const o = await Cart.get();
  const items = o.items || [];
  const allowed = items.reduce((s, i) => { const c = comboOf(i.productId); return s + (c ? c.n * (i.quantity || 1) : 0); }, 0);
  const inCombo = items.filter(i => inComboOf(i.productId));
  const have = inCombo.reduce((s, i) => s + (i.quantity || 1), 0);
  if (have > allowed) for (const i of inCombo) await Cart.remove(i.productId);
}

/* ---------- всичко в количката по номера в магазина ---------- */
function storeInfo(id) {
  const p = PRODUCTS.find(x => x.store === id);
  if (p) return { name: p.name, img: productLook(p).img, url: productUrl(p.id), p };
  for (const key of Object.keys(PACKS)) {
    const k = PACKS[key].find(x => x.store === id);
    if (k) { const pp = P(key) || PRODUCTS.find(x => x.packs === key); const b = k.bundle && B(k.bundle); return { name: b ? b.title : `${pp.shortName} – ${k.label}`, img: (b && (b.img || (b.collage && b.collage[0][0]))) || productLook(pp).img, url: productUrl(pp.id), p: pp }; }
  }
  const b = BUNDLES.find(x => x.store === id);
  if (b) return { name: b.title, img: b.img || (b.collage && b.collage[0][0]) || P('gel').img };
  const bump = BUMPS.find(x => x.store === id);
  if (bump) return { name: bump.title, img: productLook(P(bump.id)).img, url: productUrl(bump.id) };
  if (id === UPSELL.store) return { name: P(UPSELL.product).name, img: productLook(P(UPSELL.product)).img };
  if (id === CONFIG.giftStoreId) return { name: 'Подарък: 12 билкови пластира BeeHerb', img: productLook(P('beeherb')).img, gift: true };
  const c = comboOf(id);
  if (c) return { name: c.title, img: productLook(P('apetit')).img, combo: c };
  const ic = inComboOf(id);
  if (ic) return { name: `${P(ic).shortName} (в комплект)`, img: productLook(P(ic)).img, inCombo: true };
  return { name: '', img: '' };
}

/* ---------- лентата със съобщения ---------- */
function announceHtml() {
  const msgs = [];
  if (bfOn()) msgs.push(`⚫ <b>ЧЕРЕН ПЕТЪК:</b> 3 гела + 12 пластира за ${fmt(B('bf3').price)} · остават <span class="cd-mini" data-cd-mini></span> · <a href="${L.bf}">Виж офертите →</a>`);
  if (FREE_FROM) msgs.push(`🚚 <b>Безплатна доставка до офис</b> при поръчка над ${fmt(FREE_FROM)}`);
  msgs.push(`💶 Плащаш при получаване · 🛡️ <b>${CONFIG.guaranteeDays} дни гаранция</b>`);
  msgs.push(`📞 Поръчка и по телефона: <a href="tel:${CONFIG.phoneHref}"><b>${CONFIG.phone}</b></a>`);
  return `<div class="sp-announce" role="region" aria-label="Съобщения"><div class="sp-announce__in">${msgs.map((m, i) => `<p class="${i ? '' : 'on'}">${m}</p>`).join('')}</div></div>`;
}
function rotateAnnounce(h) {
  const ps = $$('.sp-announce p', h);
  if (ps.length < 2 || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  let i = 0;
  setInterval(() => { ps[i].classList.remove('on'); i = (i + 1) % ps.length; ps[i].classList.add('on'); }, 4500);
}

function showPanel(el) {
  closePanels(true);
  $('.sp-overlay').hidden = false;
  requestAnimationFrame(() => { el.classList.add('open'); el.setAttribute('aria-hidden', 'false'); $('.sp-overlay').classList.add('on'); el.focus({ preventScroll: true }); });
  document.documentElement.style.overflow = 'hidden';
}
function closePanels(keep) {
  $$('.sp-drawer.open,.sp-menu.open').forEach(el => { el.classList.remove('open'); el.setAttribute('aria-hidden', 'true'); });
  const ov = $('.sp-overlay');
  if (ov && keep !== true) { ov.classList.remove('on'); setTimeout(() => { if (!ov.classList.contains('on')) ov.hidden = true; }, 300); }
  if (keep !== true) document.documentElement.style.overflow = '';
}
function openMenu() { shopPanels(); showPanel($('.sp-menu')); }

let cartBusy = false;
async function openCart() {
  shopPanels();
  const d = $('.sp-drawer');
  showPanel(d);
  $('.sp-drawer__body', d).innerHTML = '<p class="sp-drawer__loading">Зареждаме количката…</p>';
  drawCart(await Cart.get());
}
function drawCart(o) {
  const d = $('.sp-drawer');
  if (!d) return;
  const items = o.items || [];
  const body = $('.sp-drawer__body', d), foot = $('.sp-drawer__foot', d);
  const main = items.filter(i => !isGift(i) && !inComboOf(i.productId));
  const sub = items.reduce((s, i) => s + (+i.price || 0), 0);
  $('[data-drawer-count]', d).textContent = main.length ? `(${countOf(o)})` : '';
  if (!main.length) {
    body.innerHTML = `<div class="sp-empty"><div class="sp-empty__ico">${ICON.bag}</div><h3>Количката е празна</h3><p>Разгледай продуктите – поръчката отнема по-малко от минута.</p>
      <a class="bv-btn sp-wide" href="${bfOn() ? L.bf : L.products}">${bfOn() ? '★ Офертите за Черен петък' : 'Към продуктите'}</a>
      <div class="sp-recs"><p class="sp-recs__lbl">Най-поръчвани</p>${recs([]).map(recRow).join('')}</div></div>`;
    foot.innerHTML = '';
    bindAddButtons(body);
    return;
  }
  const left = FREE_FROM ? Math.max(0, FREE_FROM - sub) : 0;
  const pct = FREE_FROM ? Math.min(100, Math.round(sub / FREE_FROM * 100)) : 100;
  const line = i => {
    const info = storeInfo(i.productId);
    const c = info.combo;
    const parts = c ? items.filter(x => inComboOf(x.productId)).map(x => P(inComboOf(x.productId)).shortName) : [];
    return `<div class="sp-line" data-id="${i.productId}">
      <a class="sp-line__img"${info.url ? ` href="${info.url}"` : ''}><img src="${info.img}" alt="" width="84" height="84" loading="lazy"></a>
      <div class="sp-line__txt"><b>${esc(info.name || i.title)}</b>
        ${c ? `<small>${parts.map(esc).join(' · ')}</small>` : ''}
        <div class="sp-line__row">${c ? '<span class="sp-line__fixed">1 комплект</span>' : `<div class="sp-qty"><button type="button" data-q="-1" aria-label="По-малко">−</button><span>${i.quantity || 1}</span><button type="button" data-q="1" aria-label="Повече">+</button></div>`}
          <span class="sp-line__price">${fmt(+i.price || 0)}</span></div>
        <button class="sp-line__rm" type="button" data-rm>${ICON.trash} Премахни</button></div></div>`;
  };
  const gift = items.find(isGift);
  body.innerHTML = `
    ${FREE_FROM ? `<div class="sp-ship"><p>${ICON.truck}<span>${left > 0 ? `Още <b>${fmt(left)}</b> до <b>безплатна доставка</b> до офис` : '<b>Доставката до офис е безплатна!</b>'}</span></p><div class="sp-ship__bar"><i style="width:${pct}%"></i></div></div>` : ''}
    <div class="sp-lines">${main.map(line).join('')}

async function setQty(id, q, row) {
  if (cartBusy) return;
  cartBusy = true;
  if (row) row.classList.add('is-busy');
  try {
    await Cart.remove(id);
    if (q > 0) await Cart.add(id, q);
    await syncCombos();
    await syncGift();
  } catch (e) { toast('Не успяхме да променим количката. Опитай пак или поръчай по телефона:', true); }
  cartBusy = false;
  const o = await Cart.get();
  updateCount(o);
  drawCart(o);
}
// предложения в количката: към ставите – пластири и спрей, към пластир – друг пластир, иначе най-поръчваните
function recs(items) {
  const ids = items.map(i => i.productId);
  const has = p => ids.includes(p.store);
  const inCart = items.map(i => storeInfo(i.productId).p).filter(Boolean);
  let pool;
  if (inCart.some(p => p.cat === 'stavi')) pool = ['bvpatch', 'beeherb', 'spray', 'hyal'];
  else if (inCart.some(p => p.wellness)) pool = PRODUCTS.filter(p => p.wellness).map(p => p.id);
  else if (inCart.some(p => p.cat === 'kraka' || p.cat === 'koja')) pool = ['vein', 'nail', 'skin', 'ghk'];
  else pool = ['gel', 'beeherb', 'vein', 'skin'];
  // без продукта, който по време на Черния петък вече е подарък в поръчката;
  // първи са тези, с които поръчката стига безплатната доставка
  const sub = items.filter(i => !isGift(i)).reduce((t, i) => t + (+i.price || 0), 0);
  const left = FREE_FROM && sub > 0 ? FREE_FROM - sub : 0;
  const list = pool.map(P).filter(p => p && !has(p) && !inCart.includes(p) && !(bfOn() && items.some(isGift) && p.id === 'beeherb'));
  return left > 0 ? list.slice().sort((x, y) => (fromPrice(y) >= left) - (fromPrice(x) >= left)) : list;
}

/* офертите на продукта: комплекти от PACKS или единичната цена */
function landingOffers(p, d) {
  const gift = bfOn(); // подаръкът на Черния петък върви с всяка поръчка (syncGift)
  const unit = p.price;
  const list = p.packs ? PACKS[p.packs] : [{ key: p.id, label: '1 брой', sub: p.size, store: p.store, price: p.price }];
  const best = list.reduce((a, k) => (k.price / (packQty(p, k) || 1) < a.price / (packQty(p, a) || 1) ? k : a), list[0]);
  return list.map(k => {
    const bundle = k.bundle ? B(k.bundle) : null;
    const qty = packQty(p, k);
    const regular = bundle ? bundle.items.reduce((s, [id, n]) => s + P(id).price * n, 0) : unit * qty;
    const off = regular > k.price + .01 ? Math.round((1 - k.price / regular) * 100) : 0;
    const hot = !!k.featured && list.length > 1;
    const isBest = !hot && list.length > 2 && k === best;
    const sc = sceneOf(p.id);
    const m = (d.packMedia && d.packMedia[k.key]) || (bundle && (bundle.img || (bundle.collage && bundle.collage[0][0]))) || (sc ? sc.small : p.img);
    const lis = [];
    if (gift) lis.push(`<li class="bv-gift"><span><b>+ ${esc(GIFT_TEXT.replace(' подарък', ''))}</b> – подарък до 30 ноември</span></li>`);
    if (bundle && bundle.note) lis.push(`<li>${esc(bundle.note)}</li>`);
    else if (qty === 1) lis.push(`<li>${list.length > 1 ? 'За да пробваш' : esc(p.bullets[0])}</li>`);
    if (qty > 1 || bundle) lis.push(`<li>${esc(bundle ? bundle.line : `${qty} броя`)}</li>`);
    if (off) lis.push(`<li class="bv-save">Спестяваш ${fmt(regular - k.price)}</li>`);
    else lis.push(`<li>${CONFIG.guaranteeDays} дни гаранция</li>`);
    if (freeShipFor(k.price)) lis.push('<li class="bv-save">Безплатна доставка до офис</li>');
    const per = qty > 1 ? `само ${fmt(k.price / qty)} за брой` : 'Плащаш при получаване';
    return `<article class="bv-pack${hot ? ' bv-pack--hot' : ''}${isBest ? ' bv-pack--best' : ''}">
      ${hot ? '<span class="bv-ribbon">⭐ Най-избиран</span>' : isBest ? '<span class="bv-ribbon bv-ribbon--gold">💰 Най-изгоден</span>' : ''}
      ${off ? `<span class="bv-off">−${off}%</span>` : ''}
      <div class="bv-pack__media">${bvMedia(m, k.label, 640, 512)}${SPARKS}</div>
      <div class="bv-pack__body">
        <h3>${esc(k.label)}</h3>
        <p class="bv-pack__sub">${esc(String(k.sub || p.size).replace(/ · най-(избиран|изгодно)$/, ''))}</p>
        <ul>${lis.join('')}</ul>
        <div class="bv-price"><b${off ? ` data-from="${regular.toFixed(2)}"` : ''}>${fmt(k.price)}</b>${off ? `<s>${fmt(regular)}</s>` : ''}</div>
        <p class="bv-unit">${per}</p>
        <button class="bv-btn${hot ? ' bv-pulse' : ''}" type="button" data-bv-buy="${k.store}" data-bv-key="${esc(k.key)}">Избирам този пакет</button>
        <p class="bv-pack__note"><span>💶 Плащаш при получаване</span><span>🚚 Пристига: <b class="bv-eta-short">до 2 работни дни</b></span></p>
      </div></article>`;
  }).join('');
}
function packQty(p, k) {
  const b = k.bundle ? B(k.bundle) : null;
  if (b) return b.items.filter(([id]) => id === p.id).reduce((s, [, n]) => s + n, 0) || 1;
  const m = /^(\d+)/.exec(k.label);
  return m ? +m[1] : 1;
}

const ingShort = n => {
  const t = String(n).replace(/^Екстракт от /i, '').replace(/^Кора от /i, '').replace(/^Гъба /i, '').replace(/\s*\(.*?\)\s*/g, ' ')
    .replace(/[„“"]/g, '').replace(/^Витамини от група B$/i, 'Витамини B').trim();
  return t.charAt(0).toUpperCase() + t.slice(1);
};
function ingRing(p, ings) {
  const list = ings.slice(0, 7);
  return `<div class="bv-ring" style="--n:${list.length}">
    <span class="bv-ring__orbit" aria-hidden="true"></span>
    <div class="bv-ring__core"><img src="${productLook(p).img}" alt="${esc(p.name)}" loading="lazy" decoding="async"><span class="bv-ring__cap">${list.length} съставки</span></div>
    <ul class="bv-ring__list" aria-label="Съставки">${list.map(([n], i) => `<li style="--i:${i}"><span class="bv-ring__spin"><span class="bv-ring__b"><i aria-hidden="true">${ingIcon(n)}</i><b>${esc(ingShort(n))}</b></span></span></li>`).join('')}</ul>
  </div>`;
}
/* силует отпред; точките са местата за залепване – по реда на ZONE_AT */
const ZONE_AT = { 'ръка': [56, 120], 'китка': [157, 196], 'гърди': [84, 98], 'корем': [102, 150], 'хълбок': [128, 188] };
const bodySvg = zones => `<svg class="bv-body" viewBox="0 0 200 350" role="img" aria-label="Местата за залепване на пластира">
  <g class="bv-body__fig"><circle cx="100" cy="36" r="23"/><rect x="91" y="54" width="18" height="16" rx="6"/><rect x="60" y="68" width="80" height="132" rx="30"/>
    <path d="M66 84 40 206M134 84l26 122" stroke-width="20"/><path d="M84 192 79 338M116 192l5 146" stroke-width="27"/></g>
  ${zones.map(([, k], i) => { const [x, y] = ZONE_AT[k] || [100, 120]; return `<g class="bv-body__dot" style="--d:${(i * .5).toFixed(1)}s"><circle class="bv-body__ping" cx="${x}" cy="${y}" r="10"/><circle class="bv-body__pt" cx="${x}" cy="${y}" r="10"/><text x="${x}" y="${y + 4}" text-anchor="middle">${i + 1}</text></g>`; }).join('')}
</svg>`;
function layersSection(L, p) {
  if (!L) return '';
  const plate = (i, cls) => `<div class="bv-plate bv-plate--${i + 1}"><div class="bv-plate__face ${cls}"></div><span class="bv-plate__n">${i + 1}</span></div>`;
  return `
  <section class="bv-layers"><div class="bv-wrap">
    <div class="bv-center"><span class="bv-eyebrow">${esc(L.eyebrow)}</span><h2>${hTxt(L.h2)}</h2><p class="bv-lead">${esc(L.lead)}</p></div>
    <div class="bv-layers__grid">
      <div class="bv-layers__stack bv-rv" aria-hidden="true">${plate(0, 'bv-plate__face--top')}${plate(1, 'bv-plate__face--mid')}${plate(2, 'bv-plate__face--glue')}</div>
      <ol class="bv-layers__list">${L.items.map(([h, t], i) => `<li class="bv-rv" style="--bv-d:${(i * .15).toFixed(2)}s"><span class="bv-layers__n">${i + 1}</span><div><h3>${esc(h)}</h3><p>${esc(t)}</p></div></li>`).join('')}</ol>
    </div>
    ${L.zones ? `<div class="bv-zones">
      <div class="bv-zones__fig bv-rv">${bodySvg(L.zones)}</div>

        <h3>Къде да го залепиш?</h3>
        <ol class="bv-zones__list">${L.zones.map(([t], i) => `<li><span>${i + 1}</span>${esc(t)}</li>`).join('')}</ol>
        ${L.when ? `<p class="bv-zones__lbl">Носиш го навсякъде – до 8 часа</p><div class="bv-zones__when">${L.when.map(([ic, t]) => `<span><i aria-hidden="true">${ic}</i>${esc(t)}</span>`).join('')}</div>` : ''}
        ${L.note ? `<div class="bv-note"><span>🔄</span><span>${esc(L.note)}</span></div>` : ''}
      </div>
    </div>` : ''}
  </div></section>`;
}

function renderLanding(p) {

  </div></div></section>`;

  // --- формулата (тъмен блок)
  const f = d.formula || c.formula || {};
  const stats = f.stats || c.stats || [[String(ings.length || 1), ings.length === 1 ? 'активна съставка' : 'активни съставки'], [String(days), 'дни гаранция'], ['1–2', 'работни дни до вратата ти'], ['0 €', 'предплащане – плащаш на куриера']];

/* ---------- ефектите (по beeevenom.eu) ---------- */
function bvEffects(root) {
  root.classList.add('bv-js');
  const mm = q => !!(window.matchMedia && matchMedia(q).matches);
  const reduce = mm('(prefers-reduced-motion: reduce)'), fine = mm('(hover: hover) and (pointer: fine)');
  const sticky = root.querySelector('.bvp-sticky');

    const add = (d, n) => { d = new Date(d); while (n > 0) { d.setDate(d.getDate() + 1); const w = d.getDay(); if (w !== 0 && w !== 6) n--; } return d; };
    const wd = new Intl.DateTimeFormat('bg-BG', { weekday: 'short' }), mo = new Intl.DateTimeFormat('bg-BG', { month: 'long' });
    const d1 = add(new Date(), 1), d2 = add(new Date(), 2), day = d => `${wd.format(d)}, ${d.getDate()}`;
    const ms = ['яну.', 'фев.', 'март', 'апр.', 'май', 'юни', 'юли', 'авг.', 'сеп.', 'окт.', 'ное.', 'дек.'];
    const same = d1.getMonth() === d2.getMonth();
    $$('.bv-eta-long', root).forEach(e => { e.textContent = same ? `${day(d1)} – ${day(d2)} ${mo.format(d2)}` : `${day(d1)} ${mo.format(d1)} – ${day(d2)} ${mo.format(d2)}`; });
    $$('.bv-eta-short', root).forEach(e => { e.textContent = same ? `${day(d1)} – ${day(d2)} ${ms[d2.getMonth()]}` : `${day(d1)} ${ms[d1.getMonth()]} – ${day(d2)} ${ms[d2.getMonth()]}`; });
  } catch (e) {}

  if (!('IntersectionObserver' in window)) { root.classList.remove('bv-js'); return; }
  const hero = root.querySelector('.bv-hero');

  // начален блок: дълбочина след мишката и златен прашец
  if (hero && !reduce && fine) {
    hero.addEventListener('pointermove', e => { const r = hero.getBoundingClientRect(); hero.style.setProperty('--px', ((e.clientX - r.left) / r.width - .5).toFixed(3)); hero.style.setProperty('--py', ((e.clientY - r.top) / r.height - .5).toFixed(3)); });
    hero.addEventListener('pointerleave', () => { hero.style.setProperty('--px', 0); hero.style.setProperty('--py', 0); });
  }
  const cv = hero && hero.querySelector('.bv-dust');
  if (cv && cv.getContext && !reduce) {
    const ctx = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1);
    let W = 0, H = 0, parts = [], running = false;
    const spr = document.createElement('canvas'); spr.width = spr.height = 32;
    const sg = spr.getContext('2d'), gr = sg.createRadialGradient(16, 16, 0, 16, 16, 16);
    const cs = getComputedStyle(root), dv = (k, f) => (cs.getPropertyValue(k) || '').trim() || f;
    gr.addColorStop(0, `rgba(${dv('--dust-a', '255,246,214')},1)`); gr.addColorStop(.35, `rgba(${dv('--dust-b', '255,212,120')},.75)`); gr.addColorStop(1, `rgba(${dv('--dust-c', '255,190,80')},0)`);
    sg.fillStyle = gr; sg.fillRect(0, 0, 32, 32);
    const spawn = (p, anyY) => Object.assign(p, { x: W * (.3 + .7 * Math.pow(Math.random(), .6)), y: anyY ? Math.random() * H : H + 12, r: 2 + Math.random() * 6, vy: .12 + Math.random() * .38, vx: -.12 + Math.random() * .24, ph: Math.random() * 6.283, tw: .008 + Math.random() * .022 });
    const size = () => { const w = hero.clientWidth, h = hero.clientHeight; if (w === W && h === H) return; W = w; H = h; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); parts = []; for (let i = 0; i < (W < 700 ? 22 : 44); i++) parts.push(spawn({}, true)); };
    const frame = () => {

      b.textContent = fmt(from);
      setTimeout(() => { let t0 = null; const step = t => { if (!t0) t0 = t; const k = Math.min(1, (t - t0) / 1100); b.textContent = fmt(from + (to - from) * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); else b.classList.add('bv-landed'); }; requestAnimationFrame(step); }, 500);
    }, { rootMargin: '0px 0px -12% 0px' }).observe(b.closest('.bv-pack') || b);
  });

  // картите се накланят леко след мишката
  if (!reduce && fine) {
    $$('.bv-pack, .bv-ben, .bv-ing, .bv-sit, .bv-hstep', root).forEach(c => {
      const tilt = c.classList.contains('bv-pack') ? 9 : 6;
      c.addEventListener('pointermove', e => {
        const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
        c.style.setProperty('--mx', ((x + .5) * 100).toFixed(1) + '%'); c.style.setProperty('--my', ((y + .5) * 100).toFixed(1) + '%');
        c.style.rotate = `${(-y).toFixed(3)} ${x.toFixed(3)} 0 ${(Math.sqrt(x * x + y * y) * tilt).toFixed(2)}deg`;
      });
      c.addEventListener('pointerleave', () => { c.style.rotate = ''; });
    });
  }

  // плавно появяване
  const rv = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('bv-in'); rv.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
  $$('.bv-rv', root).forEach(el => rv.observe(el));
}

  const off = regular > k.price + .01 ? Math.round((1 - k.price / regular) * 100) : 0;
  return { bundle, qty, regular, off };

function bindTop(root, p) {
  const top = $('#sp-top', root);
  if (!top) return;
  const data = JSON.parse($('.sp-opts-data', root).textContent);
  const opts = data.opts;
  let sel = data.sel, qty = 1, picks = [];
  // галерията
  const slides = $$('.sp-slide', top), thumbs = $$('.sp-gallery__thumbs button', top);
  let cur = 0;
  const go = i => {
    cur = (i + slides.length) % slides.length;
    slides.forEach((s, k) => {
      s.classList.toggle('on', k === cur);
      const v = $('video', s);
      if (!v) return;
      if (k === cur) { $$('source[data-src]', v).forEach(x => { x.src = x.dataset.src; x.removeAttribute('data-src'); v.load(); }); const pr = v.play(); if (pr && pr.catch) pr.catch(() => {}); } else v.pause();
    });
    thumbs.forEach((t, k) => t.classList.toggle('on', k === cur));
  };
  thumbs.forEach(t => t.addEventListener('click', () => go(+t.dataset.go)));
  const prev = $('.sp-prev', top), next = $('.sp-next', top);
  if (prev) prev.addEventListener('click', () => go(cur - 1));
  if (next) next.addEventListener('click', () => go(cur + 1));
  let x0 = null;
  const main = $('.sp-gallery__main', top);
  main.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  main.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) go(cur + (dx < 0 ? 1 : -1)); x0 = null; });
  // изборът
  const combo = $('.sp-combo', top);
  const o = () => opts.find(x => x.key === sel);
  const draw = () => {
    const x = o();
    const price = x.kind === 'qty' ? x.price * qty : x.price;
    $('[data-sp-price]', top).textContent = fmt(price);
    $('[data-sp-was]', top).textContent = x.was ? fmt(x.was) : '';
    $('[data-sp-off]', top).textContent = x.off ? `−${x.off}%` : '';
    $('[data-sp-off]', top).hidden = !x.off;
    $('[data-sp-per]', top).textContent = x.per ? `${fmt(x.per)} за ${x.kind === 'combo' ? 'кутия' : 'брой'} · ` : '';
    $$('.sp-opt', top).forEach(l => l.classList.toggle('on', $('input', l).value === sel));
    const qr = $('.sp-qtyrow', top); if (qr) qr.hidden = x.kind !== 'qty';
    if (combo) {
      combo.hidden = x.kind !== 'combo';
      if (x.kind === 'combo') {
        picks = picks.slice(0, x.n - 1);
        const need = x.n - 1 - picks.length;
        $('[data-combo-need]', combo).innerHTML = need ? `Избери още <b>${need}</b> ${need === 1 ? 'вид' : 'вида'} пластири за комплекта:` : '✓ Комплектът е готов – можеш да смениш вид с едно натискане:';
        $$('.sp-pick', combo).forEach(b => { const on = picks.includes(b.dataset.pick); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
      }
    }
    $('[data-sp-sticky-lbl]', root).textContent = x.kind === 'qty' ? `${qty} ${p.wellness ? (qty === 1 ? 'кутия' : 'кутии') : 'бр.'}` : x.label;
    $('[data-sp-sticky-price]', root).textContent = fmt(price);
  };
  $$('.sp-opt input', top).forEach(r => r.addEventListener('change', () => { sel = r.value; draw(); }));
  $$('[data-q]', top).forEach(b => b.addEventListener('click', () => { qty = Math.max(1, Math.min(20, qty + +b.dataset.q)); $('[data-qty]', top).textContent = qty; draw(); }));
  if (combo) $$('.sp-pick', combo).forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.pick, x = o();
    if (picks.includes(id)) picks = picks.filter(k => k !== id);
    else { picks.push(id); if (picks.length > x.n - 1) picks.shift(); }
    draw();
  }));
  const act = (goNow, btn) => {
    const x = o();
    if (x.kind === 'pack') return addFlow({ store: x.store, qty: 1, go: goNow, btn, value: x.price, contentId: x.key, bf: x.bf });
    if (x.kind === 'qty') return addFlow({ store: p.store, qty, go: goNow, btn, value: p.price * qty, contentId: p.id });
    if (picks.length < x.n - 1) { combo.scrollIntoView({ behavior: 'smooth', block: 'center' }); combo.classList.add('shake'); setTimeout(() => combo.classList.remove('shake'), 600); return; }
    return addCombo(x.n, [p.id].concat(picks), { go: goNow, btn });
  };
  $$('[data-sp-add]', root).forEach(b => b.addEventListener('click', () => act(false, b)));
  $$('[data-sp-buy]', root).forEach(b => b.addEventListener('click', () => act(true, b)));
  draw();
  // лепкавата лента: на компютър – щом бутоните излязат нагоре от екрана; на телефон – винаги,
  // когато бутоните не се виждат (и в самото начало: там те са чак на третия екран)
  const sticky = $('.sp-sticky', root), ctas = $('.sp-ctas', top);
  const phone = !!(window.matchMedia && matchMedia('(max-width:719px)').matches);
  if (sticky && 'IntersectionObserver' in window) new IntersectionObserver(es => {
    const out = !es[0].isIntersecting && (phone || es[0].boundingClientRect.top < 0);
    sticky.classList.toggle('on', out); sticky.setAttribute('aria-hidden', out ? 'false' : 'true');
  }).observe(ctas);
}

/* ===== Здравец Натура — логика на сайта в ConvertBuilder =====
   Количката и поръчката са тези на магазина в ConvertBuilder (WebPlatform.Store):
   бутоните добавят продукта там и водят към страницата с поръчката (CONFIG.links.checkout). */

const ROOT = (document.currentScript && document.currentScript.previousElementSibling) || document.getElementById('znl');
if (!ROOT || ROOT.dataset.znOn) return;
ROOT.dataset.znOn = '1';

/* ---------- helpers ---------- */
const $ = (s, r = ROOT) => r.querySelector(s);
const $$ = (s, r = ROOT) => [...r.querySelectorAll(s)];
const fmt = n => n.toFixed(2).replace('.', ',') + ' €';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const P = id => PRODUCTS.find(p => p.id === id);
const B = id => BUNDLES.find(b => b.id === id);
const L = CONFIG.links;
// всеки продукт е на своя страница (PRODUCT_PAGES в data.js); без такава – общата /produkt?p=
const productUrl = id => PRODUCT_PAGES[id] ? `/${PRODUCT_PAGES[id]}` : `${L.product}?p=${id}`;
const productFromPath = () => { const path = location.pathname.replace(/\/+$/, '').slice(1); const id = Object.keys(PRODUCT_PAGES).find(k => PRODUCT_PAGES[k] === path); return id ? P(id) : null; };
const local = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const page = ROOT.dataset.page || '';
const BF_END = new Date(CONFIG.bf.end).getTime();
const bfOn = () => CONFIG.bf.active && Date.now() < BF_END;
const FREE_FROM = CONFIG.freeOfficeShippingFrom || 0;
const freeShipFor = price => FREE_FROM > 0 && price >= FREE_FROM;
const SHIP_FROM = Math.min(...CONFIG.shipping.filter(m => m.office).map(m => m.price));
const GIFT_TEXT = '12 билкови пластира подарък';
const BF_STORE_IDS = BUNDLES.filter(b => b.bf !== false).map(b => b.store);

/* ---------- font size (за по-лесно четене) ---------- */
const FS = ['', 'fs-l', 'fs-xl'];
function applyFs(i) {
  document.querySelectorAll('.zn-root').forEach(r => { r.classList.remove('fs-l', 'fs-xl'); if (FS[i]) r.classList.add(FS[i]); });
  local.set('zn_fs', i);
}
applyFs(local.get('zn_fs', 0));

function track(ev, data) { try { if (window.fbq) window.fbq('track', ev, data || {}); } catch (e) {} }

/* ---------- магазинът на ConvertBuilder ---------- */
const W = () => window.WebPlatform;
const cbReady = () => { const w = W(); return !!(w && w.Store && w.Store.Orders && w.makeClientWebsiteRequest); };
function req(action, data) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('timeout')), 15000);
    const fail = e => { clearTimeout(timer); reject(e || new Error(action)); };
    try {
      W().makeClientWebsiteRequest({ action, data, onOk: r => { clearTimeout(timer); resolve(r); }, onError: fail, onFail: fail });
    } catch (e) { fail(e); }
  });
}
function setOrder(order) {
  const S = W().Store;
  S.Orders.set('cart', order);
  try { S.updateCartNumber(order.size || 0, false); } catch (e) {}
  try { W().Events.trigger(document, W().Events.ORDER_CHANGED, { id: 'cart', order }); } catch (e) {}
  updateCount(order);
  return order;
}
const Cart = {
  get() {
    return new Promise(resolve => {
      if (!cbReady()) return resolve({ items: [] });
      const timer = setTimeout(() => resolve({ items: [] }), 10000);
      try { W().Store.Orders.get('cart', o => { clearTimeout(timer); resolve(o || { items: [] }); }); } catch (e) { clearTimeout(timer); resolve({ items: [] }); }
    });
  },
  async add(storeId, qty = 1) {
    const r = await req('getStoreProduct', { id: storeId });
    const p = r.data;
    const option = { productId: p.id, quantity: qty, combination: -1, variation: [], price: p.onSale ? p.salePrice : p.price };
    const r2 = await req('addToCart', { orderId: 'cart', option: JSON.stringify(option), process: 'cart' });
    try { W().Store.reportAddToCart(r2.uid, p, option, W().Store.currency); } catch (e) {}
    return setOrder(r2.data);
  },
  async remove(storeId) {
    const o = await Cart.get();
    const index = (o.items || []).findIndex(i => i.productId === storeId);
    if (index < 0) return o;
    const r = await req('updateCart', { orderId: 'cart', products: '[]', type: 'remove', index });
    try { W().Store.reportRemoveFromCart(o.items[index], W().Store.currency); } catch (e) {}
    return setOrder(r.data);
  }
};
const isGift = i => i.productId === CONFIG.giftStoreId;
const countOf = o => (o.items || []).filter(i => !isGift(i) && !inComboOf(i.productId)).reduce((s, i) => s + (i.quantity || 1), 0);

// По време на Черния петък подаръкът е във всяка поръчка (и само заедно с друг продукт).
async function syncGift() {
  if (!CONFIG.giftStoreId || !cbReady()) return;
  const o = await Cart.get();
  const items = o.items || [];
  const gift = items.find(isGift), others = items.some(i => !isGift(i));
  if (bfOn() && others && !gift) await Cart.add(CONFIG.giftStoreId, 1);
  else if (gift && (!others || !bfOn())) await Cart.remove(CONFIG.giftStoreId);
  else if (gift && gift.quantity > 1) { await Cart.remove(CONFIG.giftStoreId); await Cart.add(CONFIG.giftStoreId, 1); }
}

let countNow = 0;
function updateCount(o) {
  if (o) countNow = countOf(o);
  $$('[data-cart-count]').forEach(el => { el.textContent = countNow; el.classList.toggle('is-zero', !countNow); });
}

/* ---------- toast ---------- */
let toastT;
function toast(msg, bad) {
  let t = $('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); ROOT.appendChild(t); }
  t.innerHTML = bad
    ? `<span>${esc(msg)}</span><a href="tel:${CONFIG.phoneHref}">${CONFIG.phone}</a>`
    : `<span>✓ ${esc(msg)}</span><a href="${L.checkout}">Към поръчката →</a>`;
  t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), bad ? 8000 : 4500);
}

/* ---------- добавяне в количката ---------- */
let busy = false;
async function addFlow({ store, qty = 1, go = false, btn = null, value = 0, contentId = '', bf = false, extra = [] }) {
  if (busy || !store) return;
  // без магазина на страницата: поръчката го добавя сама (?add=)
  if (!cbReady()) { location.href = `${L.checkout}?add=${store}&q=${qty}`; return; }
  busy = true;
  const label = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.classList.add('loading'); btn.innerHTML = 'Добавяме…'; }
  try {
    let skip = false;
    if (bf) {
      // един комплект от Черния петък в поръчката: новият заменя стария, същият не се добавя втори път
      const o = await Cart.get();
      skip = (o.items || []).some(i => i.productId === store);
      for (const it of (o.items || []).filter(i => BF_STORE_IDS.includes(i.productId) && i.productId !== store)) await Cart.remove(it.productId);
    }
    if (!skip) await Cart.add(store, qty);
    for (const x of extra) await Cart.add(x, 1);
    await syncGift();
    if (go) { location.href = L.checkout; return; }
    busy = false;
    if (btn) { btn.disabled = false; btn.classList.remove('loading'); btn.innerHTML = label; }
    openCart();
    return;
  } catch (e) {
    toast('Не успяхме да добавим продукта. Опитай пак или поръчай по телефона:', true);
  }
  busy = false;
  if (btn) { btn.disabled = false; btn.classList.remove('loading'); btn.innerHTML = label; }
}

function separateValue(b) {
  let v = b.items.reduce((s, [id, q]) => s + P(id).price * q, 0);
  if (bfOn()) v += (b.gift || []).reduce((s, [id, q]) => s + P(id).price * q, 0);
  if (b.freeShip && freeShipFor(b.price)) v += SHIP_FROM;
  return v;
}

/* ---------- countdown ---------- */
function tickCountdowns() {
  const left = Math.max(0, BF_END - Date.now());
  const d = Math.floor(left / 864e5), h = Math.floor(left / 36e5) % 24, m = Math.floor(left / 6e4) % 60, s = Math.floor(left / 1e3) % 60;
  const pad = n => String(n).padStart(2, '0');
  $$('[data-countdown]').forEach(el => {
    el.innerHTML = `<div class="u"><b>${d}</b><span>дни</span></div><div class="u"><b>${pad(h)}</b><span>часа</span></div><div class="u"><b>${pad(m)}</b><span>мин.</span></div><div class="u"><b>${pad(s)}</b><span>сек.</span></div>`;
  });
  $$('[data-cd-mini]').forEach(el => { el.textContent = `${d} д ${pad(h)}:${pad(m)}:${pad(s)}`; });
}

    <div><span>💶</span><b>Плащаш при получаване</b><small>Без карта и без предплащане</small></div>
    <div><span>🚚</span><b>Доставка 1–2 работни дни</b><small>Еконт и Спиди${FREE_FROM ? ` · безплатно над ${fmt(FREE_FROM)}` : ''}</small></div>
    <div><span>🛡️</span><b>${CONFIG.guaranteeDays} дни гаранция</b><small>Не си доволен – връщаме парите</small></div>
    <div><span>📞</span><b>Жив човек насреща</b><small>${CONFIG.phone} · ${esc(CONFIG.hours)}</small></div>
  </div></section>

/* ---------- components ---------- */
function productCard(p) { return shopCard(p); }

function bundleCard(b) {
  const sep = separateValue(b), save = sep - b.price;
  const free = b.freeShip && freeShipFor(b.price);
  const img = b.collage
    ? `<div class="collage ${b.collage.length === 2 ? 'two' : ''}">${b.collage.map(([src, alt]) => `<img src="${src}" alt="${esc(alt)}" loading="lazy">`).join('')}</div>`
    : `<img src="${b.img}" alt="${esc(b.title)}" loading="lazy">`;
  const ribbon = b.featured ? '<div class="ribbon">★ Най-избиран</div>' : (free ? '<div class="ribbon green">Безплатна доставка</div>' : '');
  return `<div class="offer ${b.featured ? 'featured' : ''}">
    ${ribbon}
    <div class="tier">${esc(b.tier)}</div>
    <h3>${esc(b.title)}</h3>
    <div class="oimg">${img}</div>
    <div class="contents">${esc(b.line)}</div>
    ${bfOn() && b.gift && b.gift.length ? `<div class="gift">🎁 Подарък: 12 билкови пластира (${fmt(P('beeherb').price)})</div>` : ''}
    <div class="pricebox"><span class="now">${fmt(b.price)}</span><span class="per">${esc(b.perUnit)}</span></div>
    <div class="ship ${free ? 'free' : ''}">${free ? '🚚 Безплатна доставка до офис' : `+ доставка от ${fmt(SHIP_FROM)} до офис`}</div>
    <div class="compare">Поотделно: ${fmt(sep)} · <b>спестяваш ${fmt(save)}</b></div>
    <div class="note">${esc(b.note)}</div>
    <button class="btn ${b.featured ? 'btn-primary' : 'btn-green'} btn-block btn-lg" type="button" data-bundle="${b.id}">Избирам ${b.id === 'bfFull' ? 'пълната грижа' : esc(b.title.replace(' за стави', ''))} →</button>
  </div>`;
}

function reviewCard(r) {
  return `<div class="review"><div class="stars" aria-label="5 от 5">★★★★★</div><p>„${esc(r.text)}“</p>
    <div class="who"><div class="av">${esc(r.name[0])}</div><div><b>${esc(r.name)}</b><span>${esc(r.city)} · ${esc(r.product)}</span><br><span class="verified">✓ Потвърдена поръчка</span></div></div></div>`;
}

function bindAddButtons(root = ROOT) {
  const fresh = el => { if (el.dataset.bound) return false; el.dataset.bound = '1'; return true; };
  $$('[data-add]', root).filter(fresh).forEach(b => b.addEventListener('click', () => {
    const p = P(b.dataset.add);
    addFlow({ store: p.store, qty: 1, btn: b, value: p.price, contentId: p.id });
  }));
  $$('[data-bundle]', root).filter(fresh).forEach(b => b.addEventListener('click', () => {
    const x = B(b.dataset.bundle);
    addFlow({ store: x.store, qty: 1, go: true, btn: b, value: x.price, contentId: x.id, bf: x.bf !== false });
  }));
}

function renderProducts() {
  const q = new URLSearchParams(location.search);
  let cat = q.get('cat') || 'all', sort = 'pop';
  const term = (q.get('q') || '').trim().toLowerCase();
  const chips = $('#chips'), grid = $('#grid');
  const order = PRODUCTS.map((p, i) => [p, i]);
  const draw = () => {
    chips.innerHTML = [['all', 'Всички']].concat(CATEGORIES.map(c => [c.id, c.name])).map(([id, n]) => `<button class="${cat === id ? 'on' : ''}" data-cat="${id}" type="button" role="tab" aria-selected="${cat === id}">${n}</button>`).join('');
    let list = order.filter(([p]) => (cat === 'all' || p.cat === cat) && (!term || [p.name, p.short].join(' ').toLowerCase().includes(term)));
    if (sort === 'pop') list.sort((a, b) => ((b[0].bestseller ? 1 : 0) - (a[0].bestseller ? 1 : 0)) || a[1] - b[1]);
    if (sort === 'asc') list.sort((a, b) => fromPrice(a[0]) - fromPrice(b[0]));
    if (sort === 'desc') list.sort((a, b) => fromPrice(b[0]) - fromPrice(a[0]));
    grid.innerHTML = list.map(([p]) => productCard(p)).join('');
    $('#found').textContent = `${list.length} ${list.length === 1 ? 'продукт' : 'продукта'}`;
    $$('[data-cat]', chips).forEach(b => b.addEventListener('click', () => { cat = b.dataset.cat; history.replaceState(null, '', cat === 'all' ? L.products : `${L.products}?cat=${cat}`); draw(); }));
    bindAddButtons(grid);
    const c = CATEGORIES.find(x => x.id === cat);
    $('#cat-title').textContent = term ? `Търсене: „${q.get('q')}“` : c ? c.name : 'Всички продукти';
    $('#crumb').textContent = c ? c.name : 'Продукти';
    $('#cat-desc').textContent = c ? c.desc + '. Плащаш при получаване.' : 'Натурална козметика и пластири с пчелна отрова и билки. Плащаш при получаване.';
  };
  $('#sort').addEventListener('change', e => { sort = e.target.value; draw(); });
  draw();
}

/* ---------- поръчката: над формата на ConvertBuilder ---------- */
function renderCheckoutHelper() {
  const box = $('#co-helper');
  if (!box) return;
  // старата страница за поръчка води към фунията (там са ъпселът и даунселът); количката е обща
  if (L.checkout !== '/poruchka' && location.pathname.replace(/\/$/, '') === '/poruchka') { location.replace(L.checkout + location.search); return; }
  const storeName = id => { const x = PRODUCTS.find(p => p.store === id) || BUNDLES.find(b => b.store === id); return x ? (x.title || x.name) : ''; };
  let working = false;

  async function draw() {
    await syncCombos();
    const o = await Cart.get();
    const items = o.items || [];
    const ids = items.map(i => i.productId);
    const main = items.filter(i => !isGift(i));
    if (!main.length) {
      drawBumps([]);
      box.innerHTML = `<div class="box empty"><h2>Количката е празна</h2><p class="lead">Избери продукт или комплект — поръчката отнема по-малко от минута.</p>
        <div class="row-btns">${bfOn() ? `<a class="btn btn-primary btn-lg" href="${L.bf}#oferti">Виж офертите за Черен петък</a>` : ''}<a class="btn btn-outline btn-lg" href="${L.products}">Всички продукти</a></div>
        <p>Или поръчай по телефона: <a href="tel:${CONFIG.phoneHref}"><b>${CONFIG.phone}</b></a></p></div>`;
      document.documentElement.classList.add('zn-cart-empty');
      return;
    }
    document.documentElement.classList.remove('zn-cart-empty');
    const total = main.reduce((s, i) => s + (+i.price || 0), 0); // цената на реда е вече по броя
    drawBumps(items);
    // по-изгоден комплект: 1 гел или 2 гела → 3 гела
    let up = '';
    const gel1 = P('gel').store, b2 = B('bf2').store, b3 = B('bf3');
    if (!ids.includes(b3.store) && !ids.includes(B('bfFull').store)) {
      const from = ids.includes(b2) ? B('bf2') : (ids.includes(gel1) ? { store: gel1, price: P('gel').price, title: '1 гел' } : null);
      if (from) up = `<div class="box upgrade"><div><h2>По-изгодно: 3 гела за ${fmt(b3.price)}</h2>
        <p>Вместо ${esc(from.title.replace(' за стави', ''))} за ${fmt(from.price)} вземи <b>3 гела</b> — само <b>+${fmt(b3.price - from.price)}</b>, около 6 седмици грижа без прекъсване.</p></div>
        <button class="btn btn-primary" type="button" data-swap="${from.store}">Да, искам 3 гела</button></div>`;
    }
    const toFree = FREE_FROM - total;
    box.innerHTML = `
      ${FREE_FROM ? `<div class="ship-progress">${toFree > 0 ? `Добави още ${fmt(toFree)} и доставката до офис е безплатна<div class="bar"><i style="width:${Math.min(100, total / FREE_FROM * 100)}%"></i></div>` : '🎉 Доставката до офис е безплатна'}</div>` : ''}
      ${up}
      ${bfOn() && items.some(isGift) ? '<p class="giftnote">🎁 Подаръкът за Черния петък (12 билкови пластира) е в поръчката ти.</p>' : ''}`;
    $$('[data-swap]', box).forEach(b => b.addEventListener('click', () => run(b, async () => { await Cart.remove(+b.dataset.swap); await Cart.add(b3.store, 1); })));
  }
  async function run(btn, fn) {
    if (working) return;
    working = true; btn.disabled = true; btn.textContent = 'Момент…';
    try { await fn(); await syncGift(); } catch (e) { toast('Не се получи. Опитай пак или се обади:', true); }
    working = false; draw();
  }

  // Бъмп офертите: отметки точно над бутона „Завърши поръчката“ във формата на ConvertBuilder.
  // Отметката добавя скрития продукт със специалната цена, махането ѝ го маха.
  let bumpItems = [];
  function drawBumps(items) {
    bumpItems = items;
    const btns = document.querySelector('.payment-step-wrapper .next-prev-buttons');
    let host = document.getElementById('zn-bumps');
    const ids = items.map(i => i.productId);
    const inBundles = BUNDLES.filter(b => ids.includes(b.store)).flatMap(b => b.items.map(x => x[0]));
    const list = BUMPS.filter(b => !inBundles.includes(b.id) && !ids.includes(P(b.id).store));
    if (!btns || !items.some(i => !isGift(i)) || !list.length) { if (host) host.remove(); return; }
    if (!host || host.nextElementSibling !== btns) {
      if (host) host.remove();
      host = document.createElement('div');
      host.id = 'zn-bumps';
      btns.parentElement.insertBefore(host, btns);
    }
    host.innerHTML = `<p class="zn-bumps-title">Специално само към тази поръчка:</p>` + list.map(b => {
      const p = P(b.id), on = ids.includes(b.store);
      return `<div class="zn-bump${on ? ' on' : ''}" role="checkbox" tabindex="0" aria-checked="${on}" data-bump="${b.id}">
        <span class="zn-bump-head"><span class="zn-box" aria-hidden="true"></span><span>Да, добави <b>${esc(b.title)}</b> за <b class="zn-price">${fmt(b.price)}</b> <s>${fmt(p.price)}</s></span></span>
        <span class="zn-bump-body"><img src="${p.img}" alt=""><span>${esc(b.text)}</span></span></div>`;
    }).join('');
    host.querySelectorAll('[data-bump]').forEach(el => {
      const toggle = async () => {
        if (working) return;
        const b = BUMPS.find(x => x.id === el.dataset.bump), on = el.getAttribute('aria-checked') === 'true';
        working = true; el.classList.add('busy');
        try { if (on) await Cart.remove(b.store); else await Cart.add(b.store, 1); await syncGift(); }
        catch (e) { toast('Не се получи. Опитай пак или се обади:', true); }
        working = false; draw();
      };
      el.addEventListener('click', toggle);
      el.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); } });
    });
  }
  // Доставката. Над прага за безплатна доставка формата показва друг списък и сама избира първия ред
  // („До адрес“, платен), макар офисът да е безплатен. Пазим избора на клиента; ако още не е избирал –
  // не оставяме платения адрес, когато има офис. Оправяме и надписите, и подсказката в полето за адрес.
  let shipKind = null;
  const kindOf = t => /спиди|speedy/i.test(t) ? 'speedy' : /еконт|econt/i.test(t) ? 'econt' : 'address';
  const SHIP_LABEL = { econt: 'До офис на Еконт', speedy: 'До офис на Спиди', address: 'До адрес (с куриер)' };
  const ADDR_HINT = { econt: 'Офис на Еконт – име или адрес на офиса', speedy: 'Офис на Спиди – име или адрес на офиса', address: 'Улица, номер, блок, вход, апартамент' };
  document.addEventListener('change', e => {
    const t = e.target;
    if (e.isTrusted && t && t.name === 'shippingOption' && t.closest('label')) shipKind = kindOf(t.closest('label').textContent);
  }, true);
  function fixShipping() {
    const wrap = document.querySelector('.payment-step-wrapper [data-role="shipping-methods"]');
    if (!wrap) return;
    const rows = [...wrap.querySelectorAll('label')].map(l => {
      const inp = l.querySelector('input[type="radio"]'), name = l.querySelector('span:not(.price)');
      return inp && name ? { l, inp, name, kind: kindOf(name.textContent) } : null;
    }).filter(Boolean);
    if (!rows.length) return;
    rows.forEach(r => {
      const tn = [...r.name.childNodes].find(n => n.nodeType === 3 && n.textContent.trim());
      if (tn && tn.textContent.trim() !== SHIP_LABEL[r.kind]) tn.textContent = SHIP_LABEL[r.kind];
    });
    let cur = rows.find(r => r.inp.checked);
    const want = shipKind ? rows.find(r => r.kind === shipKind) : (cur && cur.kind === 'address' ? rows.find(r => r.kind !== 'address') : null);
    if (want && want !== cur) { want.l.click(); cur = want; }
    const kind = cur ? cur.kind : 'address';
    const addr = document.querySelector('.payment-step-wrapper input[name="shippingAddress"]');
    if (addr && addr.placeholder !== ADDR_HINT[kind]) addr.placeholder = ADDR_HINT[kind];
    const city = document.querySelector('.payment-step-wrapper input[name="shippingCity"]');
    if (city && city.placeholder !== 'Град или село') city.placeholder = 'Град или село';
  }
  // формата на ConvertBuilder се зарежда и пренарежда сама: отметките се връщат на мястото си
  setInterval(() => {
    const btns = document.querySelector('.payment-step-wrapper .next-prev-buttons'), host = document.getElementById('zn-bumps');
    if (btns && bumpItems.length && (!host || host.nextElementSibling !== btns)) drawBumps(bumpItems);
    fixShipping();
  }, 1200);

  // редът с подаръка във формата: без + и −
  function markGiftRow() {
    document.querySelectorAll('.payment-step-wrapper .cart-row').forEach(r => {
      if (/Подарък:/.test(r.textContent)) { r.classList.add('zn-gift-row'); r.querySelectorAll('.number-pad,.cart-row-quantity').forEach(e => e.classList.add('zn-qty')); }
    });
  }

  async function start() {
    if (!cbReady()) { setTimeout(start, 300); return; }
    // ?add=<номер>&q=<брой> – добавяне от страница без магазина
    const q = new URLSearchParams(location.search);
    const add = +q.get('add');
    if (add) {
      history.replaceState(null, '', location.pathname);
      try {
        if (BF_STORE_IDS.includes(add)) { const o = await Cart.get(); for (const it of (o.items || []).filter(i => BF_STORE_IDS.includes(i.productId) && i.productId !== add)) await Cart.remove(it.productId); }
        await Cart.add(add, Math.max(1, Math.min(20, +q.get('q') || 1)));
      } catch (e) {}
    }
    try { await syncGift(); } catch (e) {}
    // всяка промяна в поръчката (бутоните + и − във формата) обновява блока
    const S = W().Store, set = S.Orders.set;
    if (!set.znWrapped) {
      S.Orders.set = function (id, order) { const r = set.apply(this, arguments); if (id === 'cart') { updateCount(order); markGiftRow(); clearTimeout(start.t); start.t = setTimeout(() => { if (!working) syncGift().catch(() => {}).then(draw); }, 400); } return r; };
      S.Orders.set.znWrapped = true;
    }
    draw();
    markGiftRow();
    const o = await Cart.get();
    track('InitiateCheckout', { value: (o.items || []).reduce((s, i) => s + (+i.price || 0), 0), currency: 'EUR', num_items: countOf(o) }); // цената на реда е вече по броя
  }
  start();
}

function renderThanks() {
  // номерът и сумата идват от магазина (последната поръчка от този браузър)
  const el = $('#order-no');
  (function wait(n) {
    const O = cbReady() && W().Store.Orders;
    if (!O || !O.getLastOrder) { if (n < 40) setTimeout(() => wait(n + 1), 250); return; }
    Promise.resolve(O.getLastOrder()).then(o => {
      const no = o && (o.no || o.number || o.orderNumber || o.id); // no = номерът на фактурата, който показва ConvertBuilder
      if (el && no) el.innerHTML = `Номер на поръчката: <b>${esc(no)}</b>${o.total ? ` · за плащане при получаване: <b>${fmt(+o.total)}</b>` : ''}`;
    }).catch(() => {});
  })(0);
}

/* ---------- офертата след поръчката (ъпсел / даунсел във фунията) ----------
   Под блока стои елементът „Ъпсел / Даунсел“ на ConvertBuilder. Нашите бутони натискат неговите
   (.upsell-positive-action / .upsell-negative-action): той добавя продукта към вече приетата
   поръчка и води към следващата стъпка. Ако нашият код не тръгне, неговите бутони си остават.  */
const JOINT_FREE = [...PRODUCTS.filter(p => p.cat !== 'stavi').map(p => p.store),
  ...Object.entries(PACKS).filter(([k]) => k !== 'gel').flatMap(([, v]) => v.map(x => x.store)),
  ...BUNDLES.filter(b => !b.items.some(x => (P(x[0]) || {}).cat === 'stavi')).map(b => b.store)];
function renderUpsell() {
  const box = $('#ups');
  if (!box) return;
  const p = P(UPSELL.product);
  const price = page === 'downsell' ? UPSELL.downsellPrice : UPSELL.price;
  $$('[data-ups-price]').forEach(e => { e.textContent = fmt(price); });
  $$('[data-ups-regular]').forEach(e => { e.textContent = fmt(p.price); });
  $$('[data-ups-save]').forEach(e => { e.textContent = fmt(p.price - price); });
  $$('[data-ups-first]').forEach(e => { e.textContent = fmt(UPSELL.price); });

  const native = yes => document.querySelector(yes ? '.upsell-positive-action' : '.upsell-negative-action');
  let pressed = false;
  function press(yes, auto) {
    const el = native(yes);
    if (!el) { if (!auto) toast('Бутонът още се зарежда — опитай след секунда.', true); return; }
    if (pressed) return;
    pressed = true;
    box.classList.add(yes ? 'is-yes' : 'is-no');
    $$('[data-ups]').forEach(b => { b.disabled = true; });
    const btn = $(`[data-ups="${yes ? 'yes' : 'no'}"]`);
    if (btn) btn.textContent = yes ? 'Добавяме го…' : 'Момент…';
    el.click();
    // ако нещо се обърка, бутоните се връщат
    setTimeout(() => { pressed = false; box.classList.remove('is-yes', 'is-no'); $$('[data-ups]').forEach(b => { b.disabled = false; b.innerHTML = b.dataset.label; }); }, 12000);
  }
  $$('[data-ups]').forEach(b => {
    b.dataset.label = b.innerHTML;
    b.addEventListener('click', e => { e.preventDefault(); press(b.dataset.ups === 'yes'); });
  });

  // елементът на ConvertBuilder се скрива, щом нашите бутони са готови
  (function hide(n) {
    const el = native(true);
    const w = el && (el.closest('.widget') || el.parentElement);
    if (w && !w.contains(ROOT)) w.style.display = 'none';
    else if (n < 60) setTimeout(() => hide(n + 1), 250);
  })(0);

  // поръчката: номерът горе, а ако кремът вече е в нея или в поръчката няма нищо за ставите – прескачаме
  (function check(n) {
    const O = cbReady() && W().Store.Orders;
    if (!O || !O.getLastOrder) { if (n < 40) setTimeout(() => check(n + 1), 250); return; }
    Promise.resolve(O.getLastOrder()).then(o => {
      const no = o && (o.no || o.number || o.orderNumber || o.id);
      if (no) $$('[data-order-no]').forEach(e => { e.textContent = ` (№ ${no})`; });
      const ids = ((o && (o.items || o.products)) || []).map(i => +i.productId).filter(id => id && id !== CONFIG.giftStoreId);
      const has = ids.some(id => id === p.store || id === UPSELL.store);
      const noJoints = ids.length && ids.every(id => JOINT_FREE.includes(id));
      if (has || noJoints) { box.classList.add('is-skip'); (function skip(k) { if (native(false)) press(false, true); else if (k < 40) setTimeout(() => skip(k + 1), 250); })(0); }
    }).catch(() => {});
  })(0);
}

/* ---------- images by key (снимките се сменят само в данните) ---------- */
$$('[data-img-key]').forEach(i => { const k = i.dataset.imgKey; const src = LIFESTYLE[k] || (P(k) && P(k).img) || (B(k) && B(k).img); if (src) i.src = src; });
$$('[data-bg-key]').forEach(i => { const src = LIFESTYLE[i.dataset.bgKey]; if (src) i.style.backgroundImage = `url("${src}")`; });
$$('[data-bf-only]').forEach(el => { if (!bfOn()) el.remove(); });
$$('[data-free-ship]').forEach(el => { if (!FREE_FROM) el.remove(); else el.querySelectorAll('[data-free-from]').forEach(x => { x.textContent = fmt(FREE_FROM); }); });
$$('[data-ship]').forEach(el => { const m = CONFIG.shipping.find(x => x.id === el.dataset.ship); if (m) el.textContent = fmt(m.price); });
$$('[data-price]').forEach(el => { const x = B(el.dataset.price) || P(el.dataset.price); if (x) el.textContent = fmt(x.price); });

/* ---------- init ---------- */
renderHeader();
renderFooter();
renderMobileBar();
if (page === 'home') { if (renderHomeBv) renderHomeBv(); else renderHome(); }
if (page === 'bf') renderBF();
if (page === 'products') renderProducts();
if (page === 'product') renderProduct();
if (page === 'checkout') renderCheckoutHelper();
if (page === 'thanks') renderThanks();
if (page === 'upsell' || page === 'downsell') renderUpsell();
bindAddButtons();
tickCountdowns(); setInterval(tickCountdowns, 1000);
// броят в количката (магазинът се зарежда малко след страницата)
(function count(n) {
  if (cbReady()) Cart.get().then(o => { updateCount(o); refreshMobileBar(); });
  else if (n < 40) setTimeout(() => count(n + 1), 250);
})(0);

})();</script>
